<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Jarvis</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      .error-screen {
        padding: 40px 20px;
        text-align: center;
      }

      .error-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .error-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .error-message {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      .error-button {
        padding: 10px 20px;
        background: #000;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .error-button:hover {
        background: #333;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Iframe loads server UI (src set dynamically in popup.js) -->
    <iframe id="ui-iframe" src="" allow="clipboard-write"></iframe>

    <!-- Error fallback -->
    <div id="error-screen" class="error-screen hidden">
      <div class="error-icon">⚠️</div>
      <h2 class="error-title">Backend Not Running</h2>
      <p class="error-message">
        The backend server is not responding. Make sure it's running on <code>localhost:3344</code>
      </p>
      <button class="error-button" onclick="location.reload()">Retry</button>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
